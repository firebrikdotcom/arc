[package]
name = "arc-auth-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Database identity and role provider plugin for Arc"
readme = "../../README.md"
keywords = ["arc", "authentication", "database", "roles", "identity"]

[features]
default = []
# PostgreSQL identity storage (diesel's libpq-backed `postgres` driver).
# Selected at runtime when the database URL starts with postgres:// or postgresql://.
postgres = ["diesel/postgres"]

[dependencies]
arc-auth-core = { path = "../arc-auth-core", version = "0.9.6" }
arc-web = { path = "../arc-web", version = "0.9.6" }
argon2.workspace = true
async-trait.workspace = true
diesel.workspace = true
rand.workspace = true
rpassword.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
