[package]
name = "arc-ffi-native-app"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib"]
[workspace]
[dependencies]
arc-ffi = { path = "../../.." }
arc-core = { path = "../../../../arc-core" }
arc-stack = { path = "../../../../arc-stack", default-features = false }
uniffi = { version = "=0.32.2", default-features = false }
async-trait = "0.1"
serde_json = "1"
diesel = { version = "2.2.6", features = ["sqlite"] }
libsqlite3-sys = { version = ">=0.30.1, <0.41.0", features = ["bundled"] }
