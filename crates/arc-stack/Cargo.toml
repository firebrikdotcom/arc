[package]
name = "arc-stack"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Headless event-sourced stack assembly for Arc"
license.workspace = true
repository.workspace = true
keywords = ["event-sourcing", "cqrs", "sqlite", "postgres", "arc"]

[features]
default = ["sqlite"]
sqlite = ["dep:arc-es-sqlite"]
postgres = ["dep:arc-es-postgres"]

[dependencies]
arc-core = { path = "../arc-core", version = "0.9.3" }
arc-es-sqlite = { path = "../arc-es-sqlite", version = "0.9.3", optional = true }
arc-es-postgres = { path = "../arc-es-postgres", version = "0.9.3", optional = true }

[dev-dependencies]
tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
uuid.workspace = true
diesel = { workspace = true, features = ["sqlite"] }
libsqlite3-sys.workspace = true
