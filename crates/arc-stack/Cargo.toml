[package]
name = "arc-stack"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Headless event-sourced stack assembly for Arc"
license.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:arc-es-sqlite"]
postgres = ["dep:arc-es-postgres"]

[dependencies]
arc-core = { path = "../arc-core", version = "0.8.11" }
arc-es-sqlite = { path = "../arc-es-sqlite", version = "0.8.11", optional = true }
arc-es-postgres = { path = "../arc-es-postgres", version = "0.8.11", optional = true }

[dev-dependencies]
tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
uuid.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
