[package]
name = "arc-es-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "SQLite EventStore implementation for arc event sourcing"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "sqlite", "projections", "audit"]
categories = ["database", "asynchronous"]

[dependencies]
# Workspace crates
arc-core = { path = "../arc-core", version = "0.8.8" }

# Database
diesel = { workspace = true, features = ["sqlite", "r2d2"] }

# Core event sourcing dependencies
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

# Logging
tracing.workspace = true

[dev-dependencies]
arc-core = { path = "../arc-core", version = "0.8.8", features = ["test-utils"] }
