{% include "parts/html-head.html" %}

<body data-controller="notification websocket">
<a class="skip-link" href="#workspace">Skip to workspace</a>
{% include "parts/notification.html" %}

<div class="workbench">
    <aside class="rail">
        <a class="brand brand--rail" href="/admin"><span class="brand__mark">A</span><span class="rail__label">{% if name %}{{ name }}{% else %}Arc{% endif %}</span></a>
        <nav aria-label="Application">
            <a href="/admin" title="Dashboard"><span class="rail__glyph" aria-hidden="true">D</span><span class="rail__label">Dashboard</span></a>
            <a href="/admin/profile" title="Profile"><span class="rail__glyph" aria-hidden="true">P</span><span class="rail__label">Profile</span></a>
            <a href="/admin/settings" title="Settings"><span class="rail__glyph" aria-hidden="true">S</span><span class="rail__label">Settings</span></a>
        </nav>
    </aside>

    <header class="topbar">
        <button type="button" class="rail-toggle" data-rail-toggle aria-expanded="true" aria-label="Collapse navigation"></button>
        <span class="mono">{{ user_name }}</span>
        <a class="button" href="/signout">Sign out</a>
    </header>

    <main id="workspace" class="workspace">
        {% block content %}{% endblock content %}
    </main>
</div>

</body>
</html>
