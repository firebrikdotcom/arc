{% extends "admin/index.html" %}

{% block content %}
<header class="page-head">
    <div>
        <p class="eyebrow">Operator / identity</p>
        <h1>Profile</h1>
    </div>
</header>

<section class="panel">
    <div class="panel__head"><h2>Profile data</h2></div>
    <form id="profile-form" class="panel__body" action="/admin/profile" method="post" data-controller="profile-form" data-turbo="false" data-action="submit->profile-form#handleSubmit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Jekyll Hyde" value="{{ user_name }}" data-profile-form-target="name" required minlength="3" maxlength="45">
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="you@example.com" value="{{ user_email }}" data-profile-form-target="email" required minlength="3" maxlength="45">
        </div>
        <div class="actions">
            <button data-profile-form-target="submitButton" type="submit" class="button button--primary">Save profile</button>
            <span data-profile-form-target="indicator" class="mono" role="status" hidden>Saving…</span>
        </div>
    </form>
</section>

<section class="panel">
    <div class="panel__head"><h2>Password</h2></div>
    <form id="password-form" class="panel__body" action="/admin/profile-password" method="post" data-controller="password-form" data-turbo="false" data-action="submit->password-form#handleSubmit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="current_email" value="{{ user_email }}">
        <div class="field">
            <label for="old_password">Old password</label>
            <input type="password" name="old_password" id="old_password" autocomplete="current-password" data-password-form-target="oldPassword" required minlength="5" maxlength="45">
        </div>
        <div class="field">
            <label for="new_password">New password</label>
            <input type="password" name="new_password" id="new_password" autocomplete="new-password" data-password-form-target="newPassword" required minlength="5" maxlength="45">
        </div>
        <div class="actions">
            <button data-password-form-target="submitButton" type="submit" class="button button--primary">Change password</button>
            <span data-password-form-target="indicator" class="mono" role="status" hidden>Saving…</span>
        </div>
    </form>
</section>
{% endblock %}
