name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NATS_SERVER_VERSION: v2.14.1

jobs:
  # Job 1: Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check for common issues
        run: |
          echo "Checking library and application diagnostics use tracing..."
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r"^\s*(?:println!|eprintln!)", re.MULTILINE)
          violations = []
          for source in sorted(Path("crates").glob("*/src/**/*.rs")):
              # CLI output is intentional; library/app diagnostics use tracing.
              if source.parts[1] == "arc-cli":
                  continue
              if pattern.search(source.read_text()):
                  violations.append(str(source))
          if violations:
              print("Runtime diagnostics must use tracing:\n" + "\n".join(violations))
              sys.exit(1)
          print("Runtime diagnostics check passed.")
          PYTHON

  # Job 2: Build
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build
        run: cargo build --verbose

      - name: Build release
        run: cargo build --release --verbose

  # Job 3: Test
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup test database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install NATS server
        run: |
          curl -fsSL -o /tmp/nats-server.tar.gz "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Run tests
        run: cargo test --verbose --all-features

      - name: Run doc tests
        run: cargo test --doc

  # Job 4: Code Coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Setup test database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install NATS server
        run: |
          curl -fsSL -o /tmp/nats-server.tar.gz "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Generate coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Job 5: Frontend Build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Job 6: Benthos routing config
  benthos:
    name: Benthos Routing Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Benthos config generator
        run: npm run benthos:config:test

      - name: Check generated Benthos config
        run: make benthos-config-check

      - name: Lint Benthos configs
        run: |
          docker run --rm \
            -e READ_MODEL_DATABASE_URL=unused \
            -v "$PWD:/work" \
            -w /work \
            docker.redpanda.com/redpandadata/connect:latest \
            lint config/benthos/events.yaml config/benthos/generated/events.yaml

  # Job 7: Documentation
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust docs
        run: cargo doc --no-deps --all-features

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install docsify-cli
        run: npm ci

      - name: Check documentation structure
        run: |
          test -f docsify-docs/index.html || { echo "Missing docsify-docs/index.html"; exit 1; }
          test -f docsify-docs/_sidebar.md || { echo "Missing docsify-docs/_sidebar.md"; exit 1; }
          test -f docsify-docs/auth-plugins.md || { echo "Missing docsify-docs/auth-plugins.md"; exit 1; }
          echo "✓ Documentation structure is valid"

      - name: Check documentation freshness
        run: make docs-check

  # Job 8: Integration Test
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup database
        run: |
          mkdir -p database
          cargo run -p arc -- migrate

      - name: Install NATS server
        run: |
          curl -fsSL -o /tmp/nats-server.tar.gz "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Run integration tests
        run: cargo test --test '*' --verbose

  bounded-collections:
    name: Bounded Collection Storage and Browser Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify SQLite, Postgres and generated browser collections in Compose
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          bash tests/bounded-reads/run.sh

  durable-audit:
    name: Durable Access Audit Restart Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the durable audit journal survives process replacement
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          bash tests/durable-audit/run-browser.sh

  security-session:
    name: Security Session Browser Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs the threat-model browser suite, including the unchanged WebSocket
      # GAP checks. Those characterize still-open issues; gating on this suite
      # does not claim they are fixed.
      - name: Verify browser session invalidation and threat-model coverage
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          bash tests/security/run.sh

  # Summary job (required for branch protection)
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, build, test, coverage, frontend, benthos, docs, integration, bounded-collections, durable-audit, security-session]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.bounded-collections.result }}" != "success" ]] || \
             [[ "${{ needs.durable-audit.result }}" != "success" ]] || \
             [[ "${{ needs.security-session.result }}" != "success" ]] || \
             [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.benthos.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
