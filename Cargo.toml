[workspace]
resolver = "2"
members = [
    "crates/arc-auth-core",
    "crates/arc-auth-db",
    "crates/arc-auth-session",
    "crates/arc-auth-admin",
    "crates/arc-auth-jwt",
    "crates/arc-auth-rbac",
    "crates/arc-core",
    "crates/arc-es-sqlite",
    "crates/arc-es-postgres",
    "crates/arc-es-nats",
    "crates/arc-web",
    "crates/arc-cli",
    "crates/arc-app",
]

[workspace.package]
version = "0.8.8"
edition = "2021"
authors = ["Savio Resende <savio@savioresende.com>"]
license = "MIT"
repository = "https://github.com/lotharthesavior/arc"

[workspace.dependencies]
# Core event sourcing dependencies
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
async-nats = "0.50"

# Web framework
actix-web = "4"
actix-files = "0.6.6"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
actix-limitation = "0.5"
actix-web-actors = "4.3"
actix = "0.13"
actix-web-lab = "0.22"
tracing-actix-web = "0.7"

# Database
diesel = { version = "2.2.6", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
diesel_migrations = "2.2.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
futures-util = "0.3.31"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Templating and web utilities
tera = "1.20.0"
urlencoding = "2.1.0"

# Security
jsonwebtoken = "9"
argon2 = "0.5.3"
validator = { version = "0.21", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"

# Utilities
dotenvy = "0.15.7"
fs_extra = "1.3.0"
rand = "0.8"
rpassword = "7"
once_cell = "1.19"
md5 = "0.7"
chrono = "0.4"

# Dev dependencies
serial_test = "2.0"
