services:
  nats:
    image: nats:latest
    command: -js
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arc_dev
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    volumes:
      - app-db:/app/database
    environment:
      DATABASE_DRIVER: sqlite
      DATABASE_URL: database/arc_dev.db
      # To use the bundled postgres service instead, build the image with the
      # `postgres` cargo feature and switch to:
      #   DATABASE_DRIVER: postgres
      #   DATABASE_URL: postgres://arc:password@postgres:5432/arc_dev
      # then add `postgres: { condition: service_healthy }` under depends_on.
      NATS_URL: nats://nats:4222
      NATS_STREAM: EVENTS
      EVENT_BUS: nats
      INTERNAL_PROJECTION_TOKEN: change-me-internal-projection-token-32-bytes
      APP_URL: 0.0.0.0
      APP_PORT: 8080
      APP_ENV: development
      SECRET_KEY: change-me-32-bytes-or-the-server-refuses-to-start
      JWT_SECRET: change-me-32-bytes-or-the-server-refuses-to-start
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Benthos (Redpanda Connect) is the single durable routing and handler-delivery
  # layer for the distributed topology. It consumes the JetStream `events.>`
  # stream that the app publishes to in EVENT_BUS=nats mode, and owns routing,
  # filtering, dedupe, retry, and dead-lettering. It replaces the retired
  # Rust durable-consumer crate. See
  # docs/architecture-decisions/0001-benthos-only-event-routing.md
  # and docs/event-handlers.md.
  benthos:
    image: docker.redpanda.com/redpandadata/connect:latest
    command: ["run", "/config/generated/events.yaml"]
    volumes:
      - ./config/benthos:/config:ro
    environment:
      # The pipeline reads these; see config/benthos/generated/events.yaml.
      NATS_URL: nats://nats:4222
      NATS_STREAM: EVENTS
      # Durable JetStream consumer name for the routing pipeline.
      NATS_CONSUMER: benthos-events
      # Used by handler manifests that call Arc-owned projection endpoints.
      INTERNAL_PROJECTION_TOKEN: change-me-internal-projection-token-32-bytes
    ports:
      # Benthos HTTP server: health on /ping, Prometheus metrics on /metrics.
      - "4195:4195"
    depends_on:
      nats:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  nats-data:
  pg-data:
  app-db:
